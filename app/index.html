<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Coach Timer</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --line: #2a2f3a; --text: #f3f4f6; --muted: #9ca3af;
    --work: #22c55e; --rest: #f97316; --accent: var(--work);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px 16px 32px; max-width: 640px; margin-inline: auto;
  }
  body.rest { --accent: var(--rest); }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 4px 0; letter-spacing: .5px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--card); color: var(--text); font: 700 18px Georgia, serif; cursor: pointer;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }

  /* Таймер */
  #timerCard { text-align: center; border-color: var(--accent); }
  #phase { font-size: 22px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
  #time {
    font-size: min(34vw, 32vh, 200px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; margin: 8px 0;
  }
  #round { color: var(--muted); font-size: 18px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 12px; }
  #progress { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  #nowPlaying { color: var(--muted); font-size: 14px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Кнопки */
  .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-top: 12px; }
  button.big {
    min-height: 64px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 700;
    background: var(--card); color: var(--text); border: 1px solid var(--line); cursor: pointer;
  }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 8px; }
  button.preset { min-height: 64px; font-size: 16px; padding: 6px 4px; }
  button.preset small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  button.preset.active { border: 2px solid var(--work); }
  #startBtn { background: var(--accent); color: #0b0d10; font-size: 22px; border: 0; }

  /* Настройки */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  label { font-size: 16px; }
  select, input[type=range] { font-size: 18px; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 120px; }
  input[type=range] { width: 140px; accent-color: var(--rest); }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--work); }
  h2 { font-size: 16px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }

  /* Плейлист */
  .add-btn {
    display: block; text-align: center; padding: 14px; border: 2px dashed var(--line);
    border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 16px;
  }
  #files { display: none; }
  ol { padding-left: 0; list-style: none; margin: 10px 0 0; counter-reset: t; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); counter-increment: t; }
  li::before { content: counter(t); color: var(--muted); width: 22px; text-align: right; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.current span { color: var(--work); font-weight: 700; }
  li button { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

  /* Соңғы 5 секунд — экранның ортасында үлкен сан */
  #final {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(15, 17, 21, .88); z-index: 10; pointer-events: none;
  }
  #final.show { display: flex; }
  #finalNum {
    font-size: min(80vw, 75vh); font-weight: 900; line-height: 1; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #finalNum.pop { animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(1.25); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  .head-btns { display: flex; gap: 8px; }
  .lang-btn { width: auto; min-width: 52px; border-radius: 20px; padding: 0 12px; font: 700 14px system-ui, sans-serif; }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 16px; max-width: 360px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog a { color: var(--work); font-size: 20px; font-weight: 700; text-decoration: none; }
  dialog button { margin-top: 12px; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>🏋️ Coach Timer</h1>
  <div class="head-btns">
    <button class="icon-btn lang-btn" id="langBtn">EN</button>
    <button class="icon-btn" id="infoBtn" data-t-aria="aInfo">i</button>
  </div>
</header>

<section class="card" id="timerCard">
  <div id="phase">ДАЙЫН</div>
  <div id="time">00:00</div>
  <div id="round">Раунд —</div>
  <div class="bar"><div id="progress"></div></div>
  <div id="nowPlaying">🎵 Музыка таңдалмаған</div>
</section>

<div class="controls">
  <button class="big" id="resetBtn" data-t-aria="aReset">⏹</button>
  <button class="big" id="startBtn">▶ СТАРТ</button>
  <button class="big" id="nextBtn" data-t-aria="aNext">⏭</button>
</div>

<section class="card">
  <h2 data-t="settings"></h2>
  <div class="presets" id="presets"></div>
  <div class="row"><label for="work" data-t="workL"></label><select id="work"></select></div>
  <div class="row"><label for="rest" data-t="restL"></label><select id="rest"></select></div>
  <div class="row"><label for="rounds" data-t="roundsL"></label><select id="rounds"></select></div>
  <div class="row"><label for="signal" data-t="signalL"></label><select id="signal"><option value="voice" data-t="sigVoice"></option><option value="gong" data-t="sigGong"></option></select></div>
  <div class="row"><label for="restVol"><span data-t="restVolL"></span> <b id="restVolTxt"></b></label><input type="range" id="restVol" min="5" max="60" step="5"></div>
  <div class="row"><label for="wake" data-t="wakeL"></label><input type="checkbox" id="wake"></div>
</section>

<section class="card">
  <h2 data-t="playlist"></h2>
  <label class="add-btn" for="files" data-t="addMusic"></label>
  <input type="file" id="files" accept="audio/*" multiple>
  <div class="row"><label for="shuffle" data-t="shuffleL"></label><input type="checkbox" id="shuffle"></div>
  <ol id="list"></ol>
  <p class="hint" data-t="hint"></p>
</section>

<div id="final"><div id="finalNum">5</div></div>

<dialog id="info">
  <h2 style="color:var(--text);font-size:20px">Coach Timer</h2>
  <p data-t="infoDesc"></p>
  <p><span data-t="author"></span> <b data-t="authorName"></b><br><a href="https://instagram.com/roman.d.m" target="_blank" rel="noopener">📷 @roman.d.m</a></p>
  <p class="hint" data-t="version"></p>
  <button class="big" id="infoClose" data-t="close"></button>
</dialog>

<script src="voices.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---------- Тіл / Language ----------
const L = {
  kk: {
    idle: 'ДАЙЫН', work: 'ЖАТТЫҒУ 🔥', rest: 'ДЕМАЛЫС ✋', done: 'БІТТІ 💪', paused: 'ПАУЗА',
    start: '▶ СТАРТ', pause: '⏸ ПАУЗА', resume: '▶ ЖАЛҒАСТЫР',
    round: 'Раунд', nRounds: n => `${n} раунд`, infRounds: 'Раунд саны шексіз',
    settings: 'Баптаулар', workL: '🔥 Жаттығу (дыбысы қатты)', restL: '✋ Демалыс (дыбысы ақырын)',
    roundsL: '🔁 Раунд саны', signalL: '🔔 Сигнал', sigVoice: '🗣 Дауыс', sigGong: '🔔 Гонг',
    restVolL: '🔉 Демалыстағы дыбыс', wakeL: '💡 Экран өшпесін',
    playlist: 'Плейлист', addMusic: '➕ Музыка қосу', shuffleL: '🔀 Аралас ойнату',
    hint: 'Әндер телефонда сақталады. Экран өшсе де музыка мен таймер жұмысын жалғастырады. Тек бетті жаппаңыз.',
    noMusic: '🎵 Музыка таңдалмаған', nTracks: n => `🎵 ${n} ән дайын`,
    needMusic: 'Алдымен музыка қосыңыз: ➕ Музыка қосу', saveFail: 'Ән сақталмады (жад толы болуы мүмкін): ',
    infoDesc: 'Тренерге арналған музыкалық интервал таймері.', author: 'Авторы:', authorName: 'Роман Давлетбаев',
    version: 'Нұсқа 1.3', close: 'Жабу',
    aInfo: 'Ақпарат', aReset: 'Тоқтату', aNext: 'Келесі ән', aDel: 'Өшіру',
    sec: 'сек', min: 'мин', inf: '∞ шексіз', langBtn: 'EN',
  },
  en: {
    idle: 'READY', work: 'WORK 🔥', rest: 'REST ✋', done: 'DONE 💪', paused: 'PAUSED',
    start: '▶ START', pause: '⏸ PAUSE', resume: '▶ RESUME',
    round: 'Round', nRounds: n => `${n} rounds`, infRounds: 'Unlimited rounds',
    settings: 'Settings', workL: '🔥 Work (music loud)', restL: '✋ Rest (music quiet)',
    roundsL: '🔁 Rounds', signalL: '🔔 Signal', sigVoice: '🗣 Voice', sigGong: '🔔 Gong',
    restVolL: '🔉 Rest volume', wakeL: '💡 Keep screen on',
    playlist: 'Playlist', addMusic: '➕ Add music', shuffleL: '🔀 Shuffle',
    hint: "Songs are saved on this phone. Music and timer keep running with the screen off — just don't close the page.",
    noMusic: '🎵 No music selected', nTracks: n => `🎵 ${n} tracks ready`,
    needMusic: 'Add music first: ➕ Add music', saveFail: 'Song was not saved (storage may be full): ',
    infoDesc: 'Music interval timer for coaches.', author: 'Author:', authorName: 'Roman Davletbayev',
    version: 'Version 1.3', close: 'Close',
    aInfo: 'Info', aReset: 'Stop', aNext: 'Next track', aDel: 'Remove',
    sec: 'sec', min: 'min', inf: '∞ unlimited', langBtn: 'ҚАЗ',
  },
};
const t = k => (L[S.lang] || L.kk)[k];

// ---------- Баптаулар ----------
const S = { lang: 'kk', work: 2, rest: 1, rounds: 0, signal: 'voice', restVol: 30, wake: true, shuffle: false };
try { Object.assign(S, JSON.parse(localStorage.getItem('coachTimer') || '{}')); } catch (e) {}
function save() { try { localStorage.setItem('coachTimer', JSON.stringify(S)); } catch (e) {} }

const minuteOpts = [10 / 60, 15 / 60, 20 / 60, 0.5, 40 / 60, 45 / 60, 1, 1.5, 2, 3, 4, 5, 6, 7, 8, 9, 10];
const minLabel = m => m < 1 ? `${Math.round(m * 60)} ${t('sec')}` : (m % 1 ? `${Math.floor(m)} ${t('min')} 30 ${t('sec')}` : `${m} ${t('min')}`);
function fill(sel, opts, label) {
  sel.innerHTML = opts.map(v => `<option value="${v}">${label(v)}</option>`).join('');
}
function fillSelects() {
  fill($('work'), minuteOpts, minLabel);
  fill($('rest'), minuteOpts, minLabel);
  fill($('rounds'), [0, ...Array.from({ length: 30 }, (_, i) => i + 1)], v => v ? String(v) : t('inf'));
  for (const k of ['work', 'rest', 'rounds']) $(k).value = S[k];
}
fillSelects();
for (const k of ['work', 'rest', 'rounds']) {
  $(k).onchange = () => { S[k] = Number($(k).value); save(); render(); markPreset(); };
}
$('signal').value = S.signal;
$('signal').onchange = () => { S.signal = $('signal').value; save(); markPreset(); };

// Дайын режимдер — бір басумен баптау
const PRESETS = [
  { icon: '⚡', name: { kk: 'Табата', en: 'Tabata' }, work: 20 / 60, rest: 10 / 60, rounds: 8, signal: 'voice' },
  { icon: '🔥', name: { kk: 'Интервал', en: 'Interval' }, work: 40 / 60, rest: 20 / 60, rounds: 10, signal: 'voice' },
  { icon: '🥊', name: { kk: 'Бокс', en: 'Boxing' }, work: 3, rest: 1, rounds: 6, signal: 'gong' },
];
function renderPresets() {
  $('presets').innerHTML = PRESETS.map((p, i) =>
    `<button class="big preset" data-p="${i}">${p.icon} ${p.name[S.lang] || p.name.kk}<small>${minLabel(p.work)} / ${minLabel(p.rest)} × ${p.rounds}</small></button>`).join('');
  markPreset();
}
$('presets').onclick = e => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  const { work, rest, rounds, signal } = PRESETS[b.dataset.p];
  Object.assign(S, { work, rest, rounds, signal });
  for (const k of ['work', 'rest', 'rounds', 'signal']) $(k).value = S[k];
  save(); render(); markPreset();
};
function markPreset() {
  document.querySelectorAll('#presets [data-p]').forEach(b => {
    const p = PRESETS[b.dataset.p];
    b.classList.toggle('active', p.work === S.work && p.rest === S.rest && p.rounds === S.rounds && p.signal === S.signal);
  });
}
renderPresets();
$('restVol').value = S.restVol;
$('restVolTxt').textContent = S.restVol + '%';
$('restVol').oninput = () => {
  S.restVol = Number($('restVol').value); $('restVolTxt').textContent = S.restVol + '%'; save();
  if (state.phase === 'rest') setMusicLevel(S.restVol / 100);
};
$('wake').checked = S.wake;
$('wake').onchange = () => { S.wake = $('wake').checked; save(); updateWakeLock(); };
$('shuffle').checked = S.shuffle;
$('shuffle').onchange = () => { S.shuffle = $('shuffle').checked; save(); };

// ---------- Дыбыс ----------
// Музыка мен командалар бір AudioContext арқылы жүреді — экран өшкенде де тоқтамайды.
const music = new Audio();
music.preload = 'auto';
let ctx, musicGain;
const voices = {};

async function initAudio() {
  if (ctx) { if (ctx.state !== 'running') await ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.onstatechange = () => { if (ctx.state !== 'running') keepMusicAlive(); };  // жүйе дыбысты тоқтатса — қайта қосамыз
  musicGain = ctx.createGain();
  ctx.createMediaElementSource(music).connect(musicGain).connect(ctx.destination);
  for (const [k, b64] of Object.entries(window.VOICES || {})) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    try { voices[k] = await ctx.decodeAudioData(bytes.buffer); } catch (e) { console.warn('voice', k, e); }
  }
}
function say(name) {
  if (!ctx || !voices[name]) return;
  const s = ctx.createBufferSource();
  s.buffer = voices[name];
  s.connect(ctx.destination);
  s.start();
}

// Бокс гонгы — синтезделеді (жүктеп алынған файл емес). Бірнеше обертон, баяу өшеді.
function bell(strikes) {
  if (!ctx) return;
  const out = ctx.createGain();
  out.gain.value = 0.45;
  out.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.02;
  for (let i = 0; i < strikes; i++) {
    const t = t0 + i * 0.35;
    for (const [ratio, amp, decay] of [[1, 1, 3.5], [2.0, 0.55, 2.2], [2.76, 0.45, 1.6], [5.4, 0.25, 0.8], [8.93, 0.15, 0.5]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 660 * ratio;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + decay + 0.05);
    }
  }
}
// Раунд бітуіне 10 секунд қалғанда — ағаш тарсылдатқыш (3 рет)
function clap(times) {
  if (!ctx) return;
  const len = Math.floor(ctx.sampleRate * 0.04);
  const noise = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noise.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const t0 = ctx.currentTime + 0.02;
  for (let i = 0; i < times; i++) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise;
    f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.5;
    g.gain.value = 1.6;
    s.connect(f).connect(g).connect(ctx.destination);
    s.start(t0 + i * 0.16);
  }
}
// Оқиға → дыбыс: дауыс немесе гонг
const CUES = {
  voice: { start: () => say('letsgo'), workEnd: () => say('stop'), restWarn: () => say('ready'), restEnd: () => say('letsgo'), finish: () => say('stop') },
  gong: { start: () => bell(1), workWarn: () => clap(3), workEnd: () => bell(3), restEnd: () => bell(1), finish: () => bell(3) },
};
function cue(ev) {
  const f = (CUES[S.signal] || CUES.voice)[ev];
  if (f) f();
}

function setMusicLevel(v, delay = 0, smooth = 0.3) {
  if (!musicGain) return;
  const t = ctx.currentTime + delay;
  musicGain.gain.cancelScheduledValues(ctx.currentTime);
  musicGain.gain.setTargetAtTime(v, t, smooth);
}

// ---------- Плейлист ----------
let tracks = [], cur = -1;

// Әндер телефонның өзінде (IndexedDB) сақталады — келесі жолы қайта таңдаудың керегі жоқ.
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open('coachTimer', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function db(mode, fn) {
  const d = await dbReady;
  return new Promise((resolve, reject) => {
    const tx = d.transaction('tracks', mode);
    const req = fn(tx.objectStore('tracks'));
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = () => reject(tx.error);
  });
}
async function loadTracks() {
  try {
    const saved = await db('readonly', s => s.getAll());
    tracks = saved.map(t => ({ id: t.id, name: t.name, url: URL.createObjectURL(t.blob) }));
  } catch (e) { console.warn('db load', e); }
  renderList();
}

$('files').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();  // телефон өзі өшіріп тастамасын
  for (const f of files) {
    const t = { name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) };
    try { t.id = await db('readwrite', s => s.add({ name: t.name, blob: f })); }
    catch (err) { console.warn('db save', err); alert(L[S.lang].saveFail + t.name); }
    tracks.push(t);
  }
  renderList();
};
function renderList() {
  $('list').innerHTML = tracks.map((t, i) =>
    `<li class="${i === cur ? 'current' : ''}"><span>${t.name.replace(/</g, '&lt;')}</span><button data-i="${i}" aria-label="${L[S.lang].aDel}">✕</button></li>`).join('');
  $('nowPlaying').textContent = cur >= 0 && tracks[cur] ? '🎵 ' + tracks[cur].name : (tracks.length ? L[S.lang].nTracks(tracks.length) : L[S.lang].noMusic);
}
$('list').onclick = e => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  const t = tracks[i];
  if (t.id !== undefined) db('readwrite', s => s.delete(t.id)).catch(console.warn);
  URL.revokeObjectURL(t.url);
  tracks.splice(i, 1);
  if (cur == i) cur = -1; else if (cur > i) cur--;
  renderList();
};
function nextIndex() {
  if (S.shuffle && tracks.length > 1) {
    let i; do { i = Math.floor(Math.random() * tracks.length); } while (i === cur);
    return i;
  }
  return (cur + 1) % tracks.length;
}
function playTrack(i) {
  if (!tracks.length) return;
  cur = i;
  music.src = tracks[cur].url;
  music.play().catch(console.warn);
  renderList();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: tracks[cur].name, artist: 'Coach Timer' });
  }
}
music.onended = () => playTrack(nextIndex());
music.onerror = () => { if (tracks.length > 1) playTrack(nextIndex()); };

// ---------- Таймер ----------
// Фазаның аяқталу уақыты сақталады, сондықтан телефон баяуласа да уақыт дұрыс.
const state = { phase: 'idle', end: 0, total: 1, left: 0, round: 1, paused: false, warned: false };

function beginPhase(p) {
  state.phase = p;
  state.total = (p === 'work' ? S.work : S.rest) * 60000;
  state.end = Date.now() + state.total;
  state.warned = false;
  document.body.classList.toggle('rest', p === 'rest');
}

async function start() {
  if (!tracks.length) { alert(t('needMusic')); return; }
  await initAudio();
  if (state.phase === 'idle' || state.phase === 'done') {
    state.round = 1;
    state.paused = false;
    beginPhase('work');
    setMusicLevel(1, 0, 0.05);
    if (cur < 0) playTrack(S.shuffle ? nextIndex() : 0);
    else if (music.src !== tracks[cur].url) playTrack(cur);
    else music.play();
    cue('start');
  } else if (state.paused) {
    state.paused = false;
    state.end = Date.now() + state.left;
    music.play();
  } else {
    state.paused = true;
    state.left = state.end - Date.now();
    music.pause();
  }
  updateWakeLock();
  render();
}

function reset() {
  state.phase = 'idle';
  state.paused = false;
  music.pause();
  setMusicLevel(1, 0, 0.05);
  document.body.classList.remove('rest');
  updateWakeLock();
  render();
}

function finishPhase() {
  if (state.phase === 'work') {
    if (S.rounds && state.round >= S.rounds) {
      cue('finish');
      state.phase = 'done';
      setMusicLevel(0, 0.5, 1);            // музыка біртіндеп сөнеді
      setTimeout(() => { if (state.phase === 'done') { music.pause(); setMusicLevel(1, 0, 0.05); } }, 5000);
      updateWakeLock();
      return;
    }
    cue('workEnd');
    setMusicLevel(S.restVol / 100, 0, 0.4);
    beginPhase('rest');
  } else if (state.phase === 'rest') {
    cue('restEnd');
    setMusicLevel(1, 0.6, 0.3);            // "Let's go" / гонг естілген соң музыка қатаяды
    state.round++;
    beginPhase('work');
  }
}

function tick() {
  if ((state.phase === 'work' || state.phase === 'rest') && !state.paused) {
    const rem = state.end - Date.now();
    if (!state.warned) {
      if (state.phase === 'rest' && rem <= 7500 && state.total > 9000) { state.warned = true; cue('restWarn'); }
      if (state.phase === 'work' && rem <= 10000 && state.total > 15000) { state.warned = true; cue('workWarn'); }
    }
    if (rem <= 0) finishPhase();
  }
  render();
}
setInterval(tick, 200);
music.addEventListener('timeupdate', tick);   // экран өшкенде қосымша "сағат"

// ---------- Экран ----------
const fmt = ms => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
let lastFinal = null;
function render() {
  const p = state.phase;
  const running = p === 'work' || p === 'rest';
  const rem = running ? (state.paused ? state.left : state.end - Date.now()) : (S.work * 60000);
  $('phase').textContent = state.paused ? t('paused') : t(p);
  $('time').textContent = p === 'done' ? '00:00' : fmt(rem);
  $('round').textContent = p === 'idle' ? (S.rounds ? t('nRounds')(S.rounds) : t('infRounds'))
    : `${t('round')} ${state.round}${S.rounds ? ' / ' + S.rounds : ''}`;
  $('progress').style.width = running ? (100 * (1 - rem / state.total)).toFixed(1) + '%' : (p === 'done' ? '100%' : '0');
  $('startBtn').textContent = running && !state.paused ? t('pause') : (state.paused ? t('resume') : t('start'));

  // Соңғы 5 секунд — үлкен сан
  const sec = Math.ceil(rem / 1000);
  const showFinal = running && !state.paused && rem > 0 && sec <= 5;
  $('final').classList.toggle('show', showFinal);
  if (showFinal && sec !== lastFinal) {
    const n = $('finalNum');
    n.textContent = sec;
    n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
  }
  lastFinal = showFinal ? sec : null;
}

// ---------- Экран өшпесін (Wake Lock) ----------
let wakeLock = null;
async function updateWakeLock() {
  const want = S.wake && (state.phase === 'work' || state.phase === 'rest') && !state.paused;
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { console.warn('wakeLock', e); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { updateWakeLock(); if (ctx && ctx.state !== 'running') ctx.resume(); }
});

// ---------- Құлыпталған экрандағы басқару ----------
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (state.paused || state.phase === 'idle') start(); });
  // Android өзі "pause" жібереді (хабарлама, Bluetooth үзілуі т.б.) — таймерді тоқтатпаймыз, музыканы қайта қосамыз.
  // Паузаны тек бағдарламаның өз батырмасымен қоюға болады.
  navigator.mediaSession.setActionHandler('pause', () => keepMusicAlive());
  navigator.mediaSession.setActionHandler('nexttrack', () => playTrack(nextIndex()));
}

// Жаттығу жүріп жатқанда музыка сырттан тоқтатылса (мысалы Strava хабарламасы) — 5 секундтан кейін қайта қосылады,
// басқа қосымшаның сөзін бөлмеу үшін. Қосылғанша 2 сек сайын қайталайды.
let resumeTimer = null;
function keepMusicAlive() {
  if (resumeTimer) return;
  const tryPlay = () => {
    resumeTimer = null;
    const running = (state.phase === 'work' || state.phase === 'rest') && !state.paused;
    if (!running || !tracks.length) return;
    if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
    if (!music.paused) return;
    music.play().catch(() => {});
    resumeTimer = setTimeout(tryPlay, 2000);
  };
  resumeTimer = setTimeout(tryPlay, 5000);
}
music.addEventListener('pause', keepMusicAlive);

// ---------- Батырмалар ----------
$('startBtn').onclick = start;
$('resetBtn').onclick = reset;
$('nextBtn').onclick = () => { if (tracks.length) { if (state.phase === 'idle') { cur = nextIndex(); renderList(); } else playTrack(nextIndex()); } };
$('infoBtn').onclick = () => $('info').showModal();
$('infoClose').onclick = () => $('info').close();

function applyLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  $('langBtn').textContent = t('langBtn');
  fillSelects();
  renderPresets();
  renderList();
  render();
}
$('langBtn').onclick = () => { S.lang = S.lang === 'en' ? 'kk' : 'en'; save(); applyLang(); };

applyLang();
loadTracks();
</script>
</body>
</html>
